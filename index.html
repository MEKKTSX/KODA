<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>KODA - Portfolio Dashboard</title>
    <script src="js/keys.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="css/koda-tokens.css">
    <link rel="stylesheet" href="css/koda-shell.css">
</head>
<body class="bg-background-dark text-slate-900 min-h-screen font-display">
<div id="koda-sidebar-container"></div>
<div class="koda-app">
<div class="koda-main">

    <header class="koda-page-header lg:pt-4">
        <div class="flex items-center gap-3">
            <div class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-primary/10">
                <span class="material-symbols-outlined text-primary">monitoring</span>
            </div>
            <div>
                <h1 class="koda-page-title">Portfolio</h1>
                <p class="text-xs text-slate-500 hidden sm:block">AI-powered dashboard</p>
            </div>
        </div>
        <div class="flex gap-1">
            <button type="button" class="p-2 rounded-lg hover:bg-slate-100 transition-colors koda-search-trigger" aria-label="Search">
                <span class="material-symbols-outlined text-slate-600">search</span>
            </button>
            <button type="button" class="p-2 rounded-lg hover:bg-slate-100 transition-colors relative" aria-label="Notifications">
                <span class="material-symbols-outlined text-slate-600">notifications</span>
                <span class="absolute top-2 right-2 flex h-2 w-2 rounded-full bg-success"></span>
            </button>
        </div>
    </header>

    <main class="px-4 lg:px-0 py-2 flex flex-col gap-6 lg:gap-8">

        <section>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <a href="portfolio.html" class="sm:col-span-2 lg:col-span-1 lg:row-span-2 flex flex-col gap-2 koda-card p-6 hover:shadow-md transition-all active:scale-[0.99] block">
                    <p class="koda-stat-label">Total Value</p>
                    <div class="flex items-end justify-between gap-3 mt-1">
                        <h2 class="koda-stat-value" id="total-value">$0.00</h2>
                        <span class="text-slate-600 text-sm font-semibold bg-slate-100 px-2.5 py-1 rounded-lg flex items-center gap-1 shrink-0" id="total-percent">
                            <span class="material-symbols-outlined text-sm">horizontal_rule</span>
                            0.00%
                        </span>
                    </div>
                </a>

                <div class="koda-card p-5 flex flex-col gap-1">
                    <p class="koda-stat-label">Top Gainer</p>
                    <p class="text-slate-900 font-bold text-xl mt-1" id="top-gainer-ticker">-</p>
                    <p class="text-slate-500 text-sm font-medium" id="top-gainer-percent">0.00%</p>
                </div>
                <div class="koda-card p-5 flex flex-col gap-1">
                    <p class="koda-stat-label">Top Loser</p>
                    <p class="text-slate-900 font-bold text-xl mt-1" id="top-loser-ticker">-</p>
                    <p class="text-slate-500 text-sm font-medium" id="top-loser-percent">0.00%</p>
                </div>
            </div>
        </section>

        <section class="lg:grid lg:grid-cols-2 lg:gap-8 lg:items-start">
            <div>
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-slate-900 text-lg font-bold tracking-tight">Sector Performance</h3>
                    <button id="btn-view-sectors" type="button" class="text-primary text-sm font-semibold hover:text-primary/80 transition-colors">View All</button>
                </div>
                <div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar" id="sector-container">
                    <p class="text-slate-500 text-sm py-4">Loading sectors...</p>
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-6 lg:mt-0">
                <div class="flex items-center justify-between shrink-0">
                    <h3 class="text-slate-900 text-lg font-bold tracking-tight">AI News Insights</h3>
                    <span class="bg-primary/10 text-primary text-[10px] font-bold px-2.5 py-1 rounded-full uppercase flex items-center gap-1.5">
                        <span class="size-1.5 bg-primary rounded-full animate-pulse"></span>Live
                    </span>
                </div>
                <div class="space-y-3 max-h-[420px] lg:max-h-[520px] overflow-y-auto no-scrollbar pb-4" id="news-container">
                    <p class="text-slate-500 text-sm text-center py-10">Scanning global markets...</p>
                </div>
            </div>
        </section>

    </main>

    <div id="modal-sectors" class="koda-modal-backdrop fixed inset-0 z-[60] hidden items-end lg:items-center justify-center bg-slate-900/40 backdrop-blur-sm transition-opacity">
        <div id="modal-sectors-content" class="koda-modal-sheet w-full max-w-lg bg-surface-dark rounded-t-3xl lg:rounded-2xl border border-border-dark flex flex-col max-h-[80vh] transform translate-y-full transition-transform duration-300 shadow-xl mx-auto lg:mx-4">
            <div class="p-5 border-b border-border-dark flex justify-between items-center sticky top-0 bg-surface-dark rounded-t-3xl lg:rounded-t-2xl z-10">
                <div class="flex items-center gap-3">
                    <div class="size-9 rounded-lg bg-primary/10 flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-xl">pie_chart</span>
                    </div>
                    <h2 class="text-slate-900 text-xl font-bold tracking-tight">Market Sectors</h2>
                </div>
                <button id="btn-close-sectors" type="button" class="text-slate-500 hover:text-slate-900 bg-slate-100 rounded-full p-1.5 active:scale-90 transition-all">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-4 overflow-y-auto space-y-3 no-scrollbar pb-20" id="all-sectors-list">
                <p class="text-slate-500 text-sm text-center py-10">Updating performance...</p>
            </div>
        </div>
    </div>

    <div id="bottom-nav-container"></div>
</div>
</div>
<script src="js/layout.js"></script>
<script>
    window.loadKodaConfig().then(() => {
        const scripts = ["js/ai-helper.js", "js/api.js", "js/stock-detail.js", "js/search.js"];
        scripts.forEach(src => {
            const s = document.createElement('script');
            s.src = src + '?v=' + Date.now();
            document.body.appendChild(s);
        });
    });
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister();
      }
    });
  }
</script>
</body>
</html>
